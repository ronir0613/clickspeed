<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#0A0A0B"/>
  <!-- Chamfered amber square mark -->
  <polygon
    points="6,2 26,2 30,6 30,26 26,30 6,30 2,26 2,6"
    fill="#FFB000"
  />
  <!-- Inner mark: stylized click cursor -->
  <polygon
    points="9,4 23,4 27,8 27,24 23,28 9,28 5,24 5,8"
    fill="#0A0A0B"
  />
  <!-- Amber dot center -->
  <rect x="13" y="12" width="6" height="6" fill="#FFB000"/>
  <!-- Corner ticks -->
  <rect x="10" y="10" width="3" height="1" fill="#FFB000" opacity="0.5"/>
  <rect x="10" y="10" width="1" height="3" fill="#FFB000" opacity="0.5"/>
  <rect x="19" y="21" width="3" height="1" fill="#FFB000" opacity="0.5"/>
  <rect x="21" y="19" width="1" height="3" fill="#FFB000" opacity="0.5"/>
</svg>
